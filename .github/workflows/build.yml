name: Build BHAYU APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build BHAYU
        working-directory: .github/workflows
        run: gradle :app:assembleDebug

      - name: Build BHAYU Remote
        working-directory: .github/workflows
        run: gradle :controller:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BHAYU-APKs
          path: |
            .github/workflows/app/build/outputs/apk/debug/*.apk
            .github/workflows/controller/build/outputs/apk/debug/*.apk
